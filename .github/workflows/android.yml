name: Build APK (Cloud)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Check google-services.json
        run: |
          test -f app/google-services.json || (echo "ERROR: app/google-services.json is missing. Drop in the real file from Firebase console (Project settings > Your apps > google-services.json) and push again. See README-CLOUD.md." && exit 1)

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: student-id-scanner-cloud-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
